[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-alpha-agent"
version = "0.1.0"
description = "Auditable WorldQuant BRAIN alpha research agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
brain-alpha = "brain_alpha_agent.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
brain = ["requests>=2.32.4,<3"]
research = ["requests>=2.32.4,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
